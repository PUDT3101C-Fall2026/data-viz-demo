<!doctype html>
<html>
  <head>
    <title>Data Viz Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      // One way of dealing with asynchronous code
      // is with events
      window.addEventListener("load", async () => {
        // Another way is with a Promise
        let response = await fetch("./data.json");

        let data = await response.json();

        data = data.map((value) => ({
          y: value.count,
          x: Date.parse(value.time),
        }));

        console.log(data[0]);

        const canvas = document.getElementById("myChart");

        new Chart(canvas, {
          type: "line",
          data: {
            datasets: [
              {
                label: "# of Votes",
                data: data,
                borderWidth: 1,
              },
            ],
          },
          options: {
            scales: {
              x: {
                type: "linear",
              },
              y: {
                beginAtZero: true,
              },
            },
          },
        });
      });
    </script>
  </head>
  <body>
    <h1>Bike Crossings</h1>
    <canvas id="myChart" />
  </body>
</html>
